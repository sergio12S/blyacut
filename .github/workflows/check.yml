name: checks
on: [push, pull_request]
jobs:
  core-and-ui:
    # FFmpeg 8 on Ubuntu 26.04 breaks the existing audio-ducking test.
    # Keep the last verified runner until that compatibility issue is fixed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npm run test:timeline
      - run: cargo fmt --all --check
      - run: cargo test -p blyacut-core -p blyacut-engine -p blyacut-session -p blyacut-mcp --locked
  macos-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
